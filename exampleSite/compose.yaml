name: careercanvas-example

x-hugo: &hugo
  image: ghcr.io/gohugoio/hugo:v0.169.0
  user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
  init: true
  working_dir: /themes/careercanvas/exampleSite
  entrypoint: []
  environment:
    HOME: /tmp
    HUGO_CACHEDIR: /tmp/hugo-cache
  volumes:
    - type: bind
      source: ..
      target: /themes/careercanvas
    - type: bind
      source: ./.docker/node_modules
      target: /themes/careercanvas/exampleSite/node_modules

services:
  site:
    <<: *hugo
    ports:
      - "127.0.0.1:${HUGO_PORT:-1313}:1313"
    command: [sh, -c, 'npm ci && exec hugo server --bind 0.0.0.0 --port 1313 --baseURL "http://localhost:${HUGO_PORT:-1313}"']
    environment:
      HOME: /tmp
      HUGO_CACHEDIR: /tmp/hugo-cache
      HUGO_PORT: "${HUGO_PORT:-1313}"

  npm:
    <<: *hugo
    profiles: [cli]
    entrypoint: [npm]
    command: [--help]
