<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local iframe example</title>
  <style>
    body { margin: 0; padding: 2rem; font: 1.125rem/1.6 system-ui, sans-serif; color: #1e293b; background: #f1f5f9; }
    main { max-width: 36rem; margin: auto; }
    img { max-width: 100%; height: auto; }
  </style>
</head>
<body>
  <main>
    <h1>A local embedded page</h1>
    <p>This standalone HTML fixture uses no scripts, external fonts, or remote resources.</p>
    <img src="/images/gallery/workspace.svg" width="640" height="400" alt="An illustrated desk with a monitor and a plant">
  </main>
</body>
</html>
