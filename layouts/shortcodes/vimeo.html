{{ $id := .Get 0 }}
<div class="w-full my-4">
  <iframe
    src="https://player.vimeo.com/video/{{ $id }}"
    class="w-full aspect-video"
    title="{{ i18n "vimeoPlayerTitle" }}"
    frameborder="0"
    allow="autoplay; fullscreen; picture-in-picture"
    allowfullscreen
    style="border:0;"
  ></iframe>
</div>
